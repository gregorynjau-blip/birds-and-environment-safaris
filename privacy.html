<style>
/* Final site-wide controls */
.site-tools{display:block;width:100%;background:#f5efe3;border-bottom:1px solid rgba(0,0,0,.08);position:relative;z-index:20}
.site-tools-inner{max-width:1200px;margin:0 auto;padding:10px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}

<body>

<header>
<h1>Privacy Policy</h1>
<p>Your privacy is important to Birds and Environment Safaris.</p>
</header>

<!-- LANGUAGE + LIVE VISITOR TOOLS -->
<div class="site-tools" aria-label="Language and live visitor information">
  <div class="site-tools-inner">
    <div class="translate-box"><label for="languageSelect">Language:</label><select id="languageSelect" aria-label="Choose language">
      <option value="en">English</option><option value="es">Español</option><option value="it">Italiano</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="nl">Nederlands</option><option value="zh-CN">中文</option><option value="ja">日本語</option><option value="sv">Svenska</option>
    </select><div id="google_translate_element" aria-hidden="true"></div></div>
    <div class="activity-box" aria-live="polite">
      <span class="activity-pill">👁 Visitors today: <strong id="visitorsToday">—</strong></span>
      <span class="activity-pill"><span class="online-dot"></span> Guests online: <strong id="guestsOnline">—</strong></span>
    </div>
  </div>
</div>
<script>
function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'es,it,fr,de,nl,zh-CN,ja,sv',layout:google.translate.TranslateElement.InlineLayout.SIMPLE},'google_translate_element');}
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>
<script>
(function(){
  function currentLang(){var m=document.cookie.match(/(?:^|; )googtrans=([^;]+)/); return m?decodeURIComponent(m[1]).split('/').pop():'en';}
  function applySiteLanguage(code){
    if(code==='en'){document.cookie='googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/'; location.reload(); return;}
    var combo=document.querySelector('.goog-te-combo');
    if(combo){combo.value=code; combo.dispatchEvent(new Event('change')); return;}
    document.cookie='googtrans=/en/'+code+';path=/'; location.reload();
  }
  document.addEventListener('DOMContentLoaded',function(){
    var sel=document.getElementById('languageSelect'); if(!sel)return;
    var lang=currentLang(); if([...sel.options].some(function(o){return o.value===lang;})) sel.value=lang;
    sel.addEventListener('change',function(){applySiteLanguage(this.value);});
  });
})();
</script>
<script>
(function(){
  const today=document.getElementById('visitorsToday'), online=document.getElementById('guestsOnline');
  if(!today||!online)return;
  fetch('https://icount.kr/api.php?id=birdsandenvironmentsafaris.com&format=json',{cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{today.textContent=(d.today&&d.today.uv!=null)?d.today.uv:'—';online.textContent=(d.realtime!=null)?d.realtime:'—';})
    .catch(()=>{today.textContent='—';online.textContent='—';});
})();
</script>
