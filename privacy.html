<!-- LANGUAGE + LIVE VISITOR TOOLS -->
<div class="site-tools" aria-label="Language and live visitor information">
  <div class="site-tools-inner">
    <div class="translate-box"><span>Language:</span><div id="google_translate_element"></div></div>
    <div class="activity-box" aria-live="polite">
      <span class="activity-pill">👁 Visitors today: <strong id="visitorsToday">—</strong></span>
      <span class="activity-pill"><span class="online-dot"></span> Guests online: <strong id="guestsOnline">—</strong></span>
    </div>
  </div>
</div>
<script>
function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'es,it,fr,de,nl,zh-CN,ja,sv',layout:google.translate.TranslateElement.InlineLayout.SIMPLE},'google_translate_element');}
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>
<script>
(function(){
  const today=document.getElementById('visitorsToday'), online=document.getElementById('guestsOnline');
  if(!today||!online)return;
  fetch('https://icount.kr/api.php?id=birdsandenvironmentsafaris&format=json',{cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{today.textContent=(d.today&&d.today.uv!=null)?d.today.uv:'—';online.textContent=(d.realtime!=null)?d.realtime:'—';})
    .catch(()=>{today.textContent='—';online.textContent='—';});
})();
</script>
