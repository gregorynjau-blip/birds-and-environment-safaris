<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    background:#f5f5f5;
    color:#333;
    line-height:1.7;
}
header{
    background:#1b5e20;
    color:#fff;
    text-align:center;
    padding:60px 20px;
}
.container{
    max-width:900px;
    margin:40px auto;
    background:#fff;

    border-radius:10px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);

    color:#1b5e20;

    background:#222;

<body>

<header>
<h1>Privacy Policy</h1>
<p>Your privacy is important to Birds and Environment Safaris.</p>
</header>

<!-- LANGUAGE + LIVE VISITOR TOOLS -->
<div class="site-tools" aria-label="Language, visitor count and guests online">
  <div class="site-tools-inner">
    <div class="language-flags" aria-label="Choose language">
      <span class="language-label">Languages:</span>
      <button type="button" onclick="translatePage('en')" title="English">🇬🇧 English</button>
      <button type="button" onclick="translatePage('es')" title="Spanish">🇪🇸 Español</button>
      <button type="button" onclick="translatePage('it')" title="Italian">🇮🇹 Italiano</button>
      <button type="button" onclick="translatePage('fr')" title="French">🇫🇷 Français</button>
      <button type="button" onclick="translatePage('de')" title="German">🇩🇪 Deutsch</button>
      <button type="button" onclick="translatePage('nl')" title="Dutch">🇳🇱 Nederlands</button>
      <button type="button" onclick="translatePage('zh-CN')" title="Chinese">🇨🇳 中文</button>
      <button type="button" onclick="translatePage('ja')" title="Japanese">🇯🇵 日本語</button>
      <button type="button" onclick="translatePage('sv')" title="Swedish">🇸🇪 Svenska</button>
    </div>
    <div class="activity-box" aria-live="polite">
      <span class="activity-pill">👁 Visitors today: <strong id="visitorsToday">—</strong></span>
      <span class="activity-pill"><span class="online-dot"></span> Guests online: <strong id="guestsOnline">—</strong></span>
    </div>
  </div>
</div>
<script>
function translatePage(lang){
  if(lang==='en'){ window.location.href=window.location.href.split('#')[0]; return; }
  const url='https://translate.google.com/translate?sl=en&tl='+encodeURIComponent(lang)+'&u='+encodeURIComponent(window.location.href);
  window.open(url,'_blank','noopener');
}
(function(){
  const today=document.getElementById('visitorsToday'), online=document.getElementById('guestsOnline');
  if(!today||!online)return;
  fetch('https://icount.kr/api.php?id=birdsandenvironmentsafaris&format=json',{cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{today.textContent=(d.today&&d.today.uv!=null)?d.today.uv:'—';online.textContent=(d.realtime!=null)?d.realtime:'—';})
    .catch(()=>{today.textContent='—';online.textContent='—';});
})();
</script>



<div class="container">
