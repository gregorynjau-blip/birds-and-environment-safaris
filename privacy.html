<head>
<meta charset="UTF-8">

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;

<body>

<header>
<h1>Privacy Policy</h1>
<p>Your privacy is important to Birds and Environment Safaris.</p>
</header>

<!-- LANGUAGE + LIVE VISITOR TOOLS -->
<div class="site-tools" aria-label="Language, visitor count and guests online">
  <div class="site-tools-inner">
    <div class="language-flags" aria-label="Choose language">
      <span class="language-label">Languages:</span>
      <button type="button" class="language-button" onclick="translatePage('en')" title="English"><img src="images/flags/gb.svg" alt="English flag"> <span>English</span></button>
      <button type="button" class="language-button" onclick="translatePage('es')" title="Español"><img src="images/flags/es.svg" alt="Español flag"> <span>Español</span></button>
      <button type="button" class="language-button" onclick="translatePage('it')" title="Italiano"><img src="images/flags/it.svg" alt="Italiano flag"> <span>Italiano</span></button>
      <button type="button" class="language-button" onclick="translatePage('fr')" title="Français"><img src="images/flags/fr.svg" alt="Français flag"> <span>Français</span></button>
      <button type="button" class="language-button" onclick="translatePage('de')" title="Deutsch"><img src="images/flags/de.svg" alt="Deutsch flag"> <span>Deutsch</span></button>
      <button type="button" class="language-button" onclick="translatePage('nl')" title="Nederlands"><img src="images/flags/nl.svg" alt="Nederlands flag"> <span>Nederlands</span></button>
      <button type="button" class="language-button" onclick="translatePage('zh-CN')" title="中文"><img src="images/flags/cn.svg" alt="中文 flag"> <span>中文</span></button>
      <button type="button" class="language-button" onclick="translatePage('ja')" title="日本語"><img src="images/flags/jp.svg" alt="日本語 flag"> <span>日本語</span></button>
      <button type="button" class="language-button" onclick="translatePage('sv')" title="Svenska"><img src="images/flags/se.svg" alt="Svenska flag"> <span>Svenska</span></button>
    </div>
    <div class="activity-box" aria-live="polite">
      <span class="activity-pill">👁 Visitors today: <strong id="visitorsToday">—</strong></span>
      <span class="activity-pill"><span class="online-dot"></span> Guests online: <strong id="guestsOnline">—</strong></span>
    </div>
  </div>
</div>
<script>
function translatePage(lang){
  if(lang==='en'){ window.location.href=window.location.href.split('#')[0]; return; }
  const url='https://translate.google.com/translate?sl=en&tl='+encodeURIComponent(lang)+'&u='+encodeURIComponent(window.location.href);
  window.open(url,'_blank','noopener');
}
(function(){
  const today=document.getElementById('visitorsToday'), online=document.getElementById('guestsOnline');
  if(!today||!online)return;
  fetch('https://icount.kr/api.php?id=birdsandenvironmentsafaris&format=json',{cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{today.textContent=(d.today&&d.today.uv!=null)?d.today.uv:'—';online.textContent=(d.realtime!=null)?d.realtime:'—';})
    .catch(()=>{today.textContent='—';online.textContent='—';});
})();
</script>
